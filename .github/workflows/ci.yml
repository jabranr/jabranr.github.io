name: CI Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    uses: jabranr/workflows/.github/workflows/reusable-pr-checks.yml@main
    with:
      run-pre-release: false
      run-unit-test: false
      run-lint: false
      run-typecheck: false

  functional-tests:
    needs: lint-and-build
    uses: jabranr/workflows/.github/workflows/reusable-integration.yml@main
    with:
      test-type: functional

  deployment-status:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        uses: jabranr/workflows/.github/actions/wait-cf-pages-deployment@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Cloudflare cache
        if: ${{ github.event_name == 'push' }}
        env:
          CF_PURGE_CACHE_TOKEN: ${{ secrets.CF_PURGE_CACHE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
          -H 'Content-Type: application/json' \
          -H "Authorization: Bearer $CF_PURGE_CACHE_TOKEN" \
          -d '{"purge_everything": true}'

  e2e-tests:
    if: ${{ github.event_name == 'push' }}
    needs: deployment-status
    uses: jabranr/workflows/.github/workflows/reusable-integration.yml@main
    with:
      test-type: e2e

  performance-audit:
    needs: deployment-status
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
      statuses: write
    steps:
      - name: Get domain
        id: get-domain
        # TODO: switch to @main once jabranr/workflows#12 is merged
        uses: jabranr/workflows/.github/actions/cf-pages-preview-url@0db84fa1bf57019c49f1771f35099f9864040b87 # feat/cf-pages-preview-url
        with:
          production-url: 'https://jabran.me'
          pages-domain: 'jabranr.pages.dev'

      - name: Performance Audit
        uses: jabranr/workflows/.github/actions/performance-audit@main
        with:
          urls: '${{ steps.get-domain.outputs.url }},${{ steps.get-domain.outputs.url }}/resume/,${{ steps.get-domain.outputs.url }}/articles/,${{ steps.get-domain.outputs.url }}/projects/,${{ steps.get-domain.outputs.url }}/speaking/'
          github-token: ${{ secrets.GITHUB_TOKEN }}
