name: CI Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    uses: jabranr/workflows/.github/workflows/reusable-pr-checks.yml@main
    with:
      run-pre-release: false
      run-unit-test: false
      run-lint: false
      run-typecheck: false

  seo-lint:
    # Lints only the pages a PR changes (Jabran's SEO loop; settings in seo.config.yaml)
    # Only the SEO loop's PRs (branches seo/...): legacy pages' known issues mustn't block human PRs
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'seo/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # seo-lint-changed diffs against the base branch

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json # volta.node
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Fetch seo-lint
        env:
          SKILLS_SHA: c20c516360aab66e25516988582b4eebc7ea152e # jabranr/skills, seo-lint-changed --build-base
        run: |
          mkdir -p "$RUNNER_TEMP/seo-lint"
          for f in seo-lint.mjs seo-lint-changed.mjs; do
            curl -fsSL "https://raw.githubusercontent.com/jabranr/skills/${SKILLS_SHA}/skills/jabraf-seo-qa/scripts/$f" \
              -o "$RUNNER_TEMP/seo-lint/$f"
          done

      - name: seo-lint changed pages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node "$RUNNER_TEMP/seo-lint/seo-lint-changed.mjs" "origin/$BASE_REF" --config seo.config.yaml --build-base

  functional-tests:
    needs: lint-and-build
    uses: jabranr/workflows/.github/workflows/reusable-integration.yml@main
    with:
      test-type: functional

  deployment-status:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        uses: jabranr/workflows/.github/actions/wait-cf-pages-deployment@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Cloudflare cache
        if: ${{ github.event_name == 'push' }}
        env:
          CF_PURGE_CACHE_TOKEN: ${{ secrets.CF_PURGE_CACHE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
          -H 'Content-Type: application/json' \
          -H "Authorization: Bearer $CF_PURGE_CACHE_TOKEN" \
          -d '{"purge_everything": true}'

  e2e-tests:
    if: ${{ github.event_name == 'push' }}
    needs: deployment-status
    uses: jabranr/workflows/.github/workflows/reusable-integration.yml@main
    with:
      test-type: e2e

  performance-audit:
    needs: deployment-status
    runs-on: ubuntu-latest
    steps:
      - name: Get domain
        id: get-domain
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "domain=https://$GITHUB_HEAD_REF.jabranr.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "domain=https://jabran.me" >> "$GITHUB_OUTPUT"
          fi

      - name: Performance Audit
        uses: jabranr/workflows/.github/actions/performance-audit@main
        with:
          urls: '${{ steps.get-domain.outputs.domain }},${{ steps.get-domain.outputs.domain }}/resume/,${{ steps.get-domain.outputs.domain }}/articles/,${{ steps.get-domain.outputs.domain }}/projects/,${{ steps.get-domain.outputs.domain }}/speaking/'
          github-token: ${{ secrets.GITHUB_TOKEN }}
